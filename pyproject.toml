[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news2signal-bench"
version = "0.1.1"
description = "Open benchmark for evaluating financial news-to-signal reasoning in AI models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
    "benchmark",
    "financial-news",
    "ai-evaluation",
    "llm-evaluation",
    "market-signals",
    "nlp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
news2signal-evaluate = "news2signal.evaluate:main"
news2signal-validate = "news2signal.validate:main"

[project.urls]
Homepage = "https://github.com/catalayer/News2SignalBench"
Repository = "https://github.com/catalayer/News2SignalBench"
"Issue Tracker" = "https://github.com/catalayer/News2SignalBench/issues"

[tool.setuptools.packages.find]
include = ["news2signal*"]
